# ---- DNS ---------------------------------------------- # 

# named.conf.local
zone "lab-smk.xyz"{
        type master;
        file "/var/cache/bind/UKK.Zone_D4vi1d.labtkj/db.UKK.labtkj_Forward";
};

zone "30.168.192.in-addr.arpa"{
        type master;
        file "/var/cache/bind/UKK.Zone_D4vi1d.labtkj/db.UKK.192tkj_Reverse";
};


# cp db.local /var/cache/bind/UKK.Zone_D4vi1d.labtkj/db.UKK.labtkj_Forward
# cp /var/cache/bind/UKK.Zone_D4vi1d.labtkj/db.UKK.192tkj_Reverse

# db.UKK.labtkj_Forward
@       IN      NS      lab-smk.xyz.
10      IN      PTR     lab-smk.xyz.

# db.UKK.192tkj_Reverse
@       IN      NS      lab-smk.xyz.
@       IN      A       192.168.30.10
d4vi1d  IN      A       192.168.30.10
www     IN      CNAME   d4vi1d
monitor IN      CNAME   d4vi1d

# named.conf.options
# L
# (+1-4)
 acl "trusted" {
          127.0.0.0/8;
          192.168.10.0/24;

# (+18-20)
 recursion yes;
         allow-query { any; };
         allow-recursion { trusted; };

# (22-24
 forwarders {
                 8.8.8.8;

# (30)
 dnssec-validation no;

# Di Mikrotik DHCP Server hilangkan DNS Server selain 192.168.30.10





